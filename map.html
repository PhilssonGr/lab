<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/brand/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/assets/brand/favicon-16.png" type="image/png" sizes="16x16" />
  <link rel="shortcut icon" href="/assets/brand/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="/assets/brand/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c0b0a" />
  <title>Map · BuildSpark AI</title>
  <meta name="description" content="The curriculum map. Live cards are links. Coming soon concepts are not." />
  <link rel="stylesheet" href="/concepts.css" />
</head>
<body class="concepts">
  <a class="skip" href="#content">Skip to content</a>
  <div class="wrap wide">
    <header class="top">
      <a class="brand" href="/"><img src="/assets/brand/logo.svg" alt="BuildSpark AI" width="519" height="100" /></a>
      <nav class="nav" aria-label="Concepts">
        <a href="/map" aria-current="page">Map</a>
        <a href="/ask">Ask</a>
        <a href="/apply">Apply</a>
      </nav>
    </header>

    <main id="content" tabindex="-1">
      <p class="kicker">The living map</p>
      <h1 data-map-title>Four tracks.</h1>
      <p class="lede">Arrows point from a prerequisite to the concept it unlocks. Open a live card to mark it in this browser. Names without a card are not links.</p>

      <div class="section graph-bay" data-widget="map">
        <div class="graph-toolbar">
          <p class="graph-track" id="map-label">Curriculum</p>
          <p class="graph-count" data-progress-count aria-live="polite">Visited 0 of 3</p>
          <button type="button" class="ghost tiny" data-reset-progress disabled>Reset progress</button>
        </div>
        <ul class="map-key">
          <li><i class="swatch visited"></i>Visited</li>
          <li><i class="swatch next"></i>Next</li>
          <li><i class="swatch locked"></i>Coming soon</li>
        </ul>
        <div class="cmap" data-map-board role="group" aria-labelledby="map-label"></div>
        <details class="rel-details">
          <summary>Prerequisite links</summary>
          <ul data-rel-list></ul>
        </details>
      </div>
      <noscript>
        <p class="fine">JavaScript draws the map from the concept registry and saves opened cards in this browser. Live cards: <a href="/tokens">Tokens</a>, <a href="/context-window">Context Window</a>, <a href="/prompting">Prompting</a>.</p>
      </noscript>
    </main>

    <footer class="foot">
      <a href="/">Home</a>
    </footer>
  </div>
  <script src="/concepts-data.js"></script>
  <script src="/concepts.js"></script>
</body>
</html>
