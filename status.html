<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/brand/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/assets/brand/favicon-16.png" type="image/png" sizes="16x16" />
  <link rel="shortcut icon" href="/assets/brand/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="/assets/brand/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c0b0a" />
  <title>Status · BuildSpark AI</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <p><a href="/">Home</a> · <a href="/learn">Learn</a></p>
  <h1>Lab status</h1>
  <p class="meta">Last five commits on PhilssonGr/lab, live from GitHub.</p>
  <ul id="list"><li class="meta">Loading…</li></ul>
  <p id="err" class="err"></p>
  <script>
    const list = document.getElementById("list");
    const err = document.getElementById("err");
    fetch("https://api.github.com/repos/PhilssonGr/lab/commits?per_page=5")
      .then((r) => {
        if (!r.ok) throw new Error("GitHub " + r.status);
        return r.json();
      })
      .then((rows) => {
        list.innerHTML = "";
        rows.forEach((row) => {
          const li = document.createElement("li");
          const msg = (row.commit && row.commit.message) || "(no message)";
          const when = row.commit && row.commit.author && row.commit.author.date
            ? row.commit.author.date.slice(0, 16).replace("T", " ")
            : "";
          li.innerHTML = "<strong>" + msg.split("\n")[0] + "</strong><br /><span class='meta'>" + when + "</span>";
          list.appendChild(li);
        });
      })
      .catch((e) => {
        list.innerHTML = "";
        err.textContent = "Fetch failed: " + e.message;
      });
  </script>
</body>
</html>
