<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/brand/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/assets/brand/favicon-16.png" type="image/png" sizes="16x16" />
  <link rel="shortcut icon" href="/assets/brand/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="/assets/brand/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c0b0a" />
  <title>Tools · BuildSpark AI</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <p><a href="/">Home</a> · <a href="/learn">Learn</a> · <a href="/status">Status</a></p>
  <h1>Tools</h1>
  <p class="meta">Paste text. Counts update as you type. Copy cleans trim + blank lines.</p>
  <textarea id="input" placeholder="Paste here…" aria-label="Text to measure"></textarea>
  <p class="stats">
    <span><strong id="words">0</strong> words</span>
    <span><strong id="chars">0</strong> characters</span>
    <span><strong id="mins">0</strong> min read</span>
  </p>
  <p>
    <button type="button" id="copy-btn">Copy cleaned text</button>
    <span id="copy-status" aria-live="polite"></span>
  </p>
  <script>
    const input = document.getElementById("input");
    const wordsEl = document.getElementById("words");
    const charsEl = document.getElementById("chars");
    const minsEl = document.getElementById("mins");
    const copyBtn = document.getElementById("copy-btn");
    const copyStatus = document.getElementById("copy-status");
    const WPM = 200;

    function wordCount(text) {
      const t = text.trim();
      if (!t) return 0;
      return t.split(/\s+/).filter(Boolean).length;
    }

    function cleanText(text) {
      return text
        .replace(/\r\n/g, "\n")
        .replace(/[ \t]+\n/g, "\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }

    function update() {
      const text = input.value;
      const w = wordCount(text);
      wordsEl.textContent = String(w);
      charsEl.textContent = String(text.length);
      minsEl.textContent = w === 0 ? "0" : String(Math.max(1, Math.ceil(w / WPM)));
    }

    input.addEventListener("input", update);
    copyBtn.addEventListener("click", async () => {
      const cleaned = cleanText(input.value);
      try {
        await navigator.clipboard.writeText(cleaned);
        copyStatus.textContent = "Copied.";
      } catch (e) {
        copyStatus.textContent = "Copy failed.";
      }
      setTimeout(() => { copyStatus.textContent = ""; }, 2000);
    });
    update();
  </script>
</body>
</html>
